<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAJ AURA - Enter PIN</title>
    <link rel="stylesheet" href="pin.css">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/8983/8983163.png">
</head>
<body>
    <section class="pin-screen">
        <div class="pin-light"></div>
        <header class="pin-header">
            <div class="pin-brand">
                <div class="pin-logo">T</div>
                <div class="brand-text">
                    <h1>TAJ AURA</h1>
                    <span>PREMIUM BANKING</span>
                </div>
            </div>
            <div class="secure-status">
                <span class="secure-dot"></span>
                SECURE CONNECTION
            </div>
        </header>
        <main class="pin-content">
            <div class="pin-icon">
                <div class="lock-shackle"></div>
                <div class="lock-body">
                    <span></span>
                </div>
            </div>
            <h2>ENTER YOUR PIN</h2>
            <p class="pin-subtitle">
                Please enter your 4-digit Personal Identification Number
            </p>
            <div class="pin-display">
                <span class="pin-dot"></span>
                <span class="pin-dot"></span>
                <span class="pin-dot"></span>
                <span class="pin-dot"></span>
            </div>
            <div class="security-message">
                <span class="security-icon">●</span>
                For your security, please cover the keypad
                while entering your PIN.
            </div>
            <div class="atm-keypad">
                <button class="key">
                    <strong>1</strong>
                    <small></small>
                </button>
                <button class="key">
                    <strong>2</strong>
                    <small>ABC</small>
                </button>
                <button class="key">
                    <strong>3</strong>
                    <small>DEF</small>
                </button>
                <button class="key">
                    <strong>4</strong>
                    <small>GHI</small>
                </button>
                <button class="key">
                    <strong>5</strong>
                    <small>JKL</small>
                </button>
                <button class="key">
                    <strong>6</strong>
                    <small>MNO</small>
                </button>
                <button class="key">
                    <strong>7</strong>
                    <small>PQRS</small>
                </button>
                <button class="key">
                    <strong>8</strong>
                    <small>TUV</small>
                </button>
                <button class="key">
                    <strong>9</strong>
                    <small>WXYZ</small>
                </button>
                <button class="key action-key cancel">
                    <strong>×</strong>
                    <small>CANCEL</small>
                </button>
                <button class="key">
                    <strong>0</strong>
                    <small></small>
                </button>
                <a href="verified.html">
                    <button class="key action-key enter">
                        <strong>✓</strong>
                        <small>ENTER</small>
                    </button>
                </a>
            </div>
        </main>
        <footer class="pin-footer">
            <span>TAJ AURA SECURE ATM</span>
            <span class="footer-line"></span>
            <span>24/7 BANKING SERVICE</span>
        </footer>
    </section>
</body>
</html>
