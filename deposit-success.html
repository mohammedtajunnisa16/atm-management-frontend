<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAJ AURA - Deposit Successful</title>
    <link rel="stylesheet" href="deposit-success.css">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/8983/8983163.png">
</head>
<body>
<div class="atm">
    <div class="led-border"></div>
    <header class="top">
        <div class="brand">
            <div class="logo">T</div>
            <div class="brand-name">
                <h2>TAJ AURA</h2>
                <span>SMART ATM</span>
            </div>
        </div>
        <div class="secure">
            <span></span>
            SECURE TRANSACTION
        </div>
    </header>
    <main class="success">
        <div class="success-label">
            CASH DEPOSIT
        </div>
        <h1>
            TRANSACTION SUCCESSFUL
        </h1>
        <p class="subtitle">
            Your cash has been deposited successfully
        </p>
        <div class="success-icon">
            <div class="check">
                ✓
            </div>
        </div>
        <div class="amount-section">
            <span>DEPOSITED AMOUNT</span>
            <strong>₹9,000.00</strong>
        </div>
        <div class="details">
            <div>
                <small>STATUS</small>
                <b>COMPLETED</b>
            </div>
            <div>
                <small>TRANSACTION</small>
                <b>SUCCESSFUL</b>
            </div>
            <div>
                <small>RECEIPT</small>
                <b>AVAILABLE</b>
            </div>
        </div>
        <div class="message">
            <span></span>
            <strong>
                PLEASE COLLECT YOUR CARD
            </strong>
        </div>
        <p class="bottom-text">
            Thank you for using TAJ AURA Smart ATM
        </p>
        <div class="action-buttons">
            <a href="menu.html" class="menu-btn">
                GO TO MENU
            </a>
            <a href="index.html" class="exit-btn">
                EXIT
            </a>
        </div>
    </main>
</div>
</body>
</html>
