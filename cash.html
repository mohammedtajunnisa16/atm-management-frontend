<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAJ AURA - Cash Dispensing</title>
    <link rel="stylesheet" href="cash.css">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/8983/8983163.png">
</head>
<body>
<main class="atm-screen">
    <div class="ambient-light"></div>
    <div class="light-sweep"></div>
    <div class="screen-border"></div>
    <header class="top-bar">
        <div class="brand">
            <div class="logo-box">T</div>
            <div>
                <div class="brand-name">TAJ AURA</div>
                <div class="brand-sub">
                    PREMIUM BANKING
                </div>
            </div>
        </div>
        <div class="secure-status">
            <span class="secure-dot"></span>
            TRANSACTION SECURED
        </div>
    </header>
    <section class="cash-content">
        <div class="eyebrow">
            TRANSACTION COMPLETE
        </div>
        <h1>
            PLEASE COLLECT YOUR CASH
        </h1>
        <p class="subtitle">
            Your cash is ready at the dispenser
        </p>
        <div class="dispenser-area">
            <div class="dispenser">
                <div class="dispenser-top">
                    <span>
                        CASH DISPENSER
                    </span>
                    <div class="indicator"></div>
                </div>
                <div class="cash-slot">
                    <div class="slot-inner">
                        <div class="cash-glow"></div>
                    </div>
                </div>
                <div class="slot-label">
                    COLLECT CASH
                </div>
            </div>
        </div>
        <div class="amount-section">
            <span class="amount-label">
                AMOUNT DISPENSED
            </span>
            <div class="amount">
                ₹5,000
            </div>
            <div class="success">
                ✓ CASH READY
            </div>
        </div>
        <div class="info-panel">
            <div class="info-item">
                <span>
                    TRANSACTION
                </span>
                <strong>
                    SUCCESSFUL
                </strong>
            </div>
            <div class="info-divider"></div>
            <div class="info-item">
                <span>
                    ACCOUNT
                </span>
                <strong>
                    SAVINGS
                </strong>
            </div>
            <div class="info-divider"></div>
            <div class="info-item">
                <span>
                    BALANCE
                </span>
                <strong>
                    ₹43,750.00
                </strong>
            </div>
        </div>
        <div class="bottom-area">
            <div class="instruction">
                PLEASE TAKE YOUR CASH
            </div>
            <a href="menu.html" class="continue-button">
                CONTINUE
            </a>
            <a href="index.html" class="exit-button">
                EXIT
            </a>
        </div>
    </section>
    <div class="bottom-led"></div>
</main>
</body>
</html>
