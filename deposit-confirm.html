<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAJ AURA - Confirm Deposit</title>
    <link rel="stylesheet" href="deposit-confirm.css">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/8983/8983163.png">
</head>
<body>
<div class="atm">
    <div class="glow glow-one"></div>
    <div class="glow glow-two"></div>
    <div class="scan-light"></div>
    <header>
        <div class="brand">
            <div class="logo">T</div>
            <div>
                <h2>TAJ AURA</h2>
                <p>SMART ATM</p>
            </div>
        </div>
        <div class="secure">
            <span></span>
            SECURE
        </div>
    </header>
    <main>
        <div class="title">
            <span>03</span>
            <h1>CONFIRM DEPOSIT</h1>
        </div>
        <section class="confirmation">
            <div class="confirm-symbol">
                ✓
            </div>
            <div class="confirm-content">
                <div class="label">
                    CASH RECEIVED
                </div>
                <div class="amount">
                    <span>₹</span>
                    <strong>9,000</strong>
                    <small>.00</small>
                </div>
                <div class="amount-line"></div>
                <p>
                    Please confirm the amount before
                    completing your deposit.
                </p>
            </div>
            <div class="deposit-detail">
                <div>
                    <span>TRANSACTION</span>
                    <strong>CASH DEPOSIT</strong>
                </div>
                <div>
                    <span>ACCOUNT</span>
                    <strong>SAVINGS</strong>
                </div>
            </div>
        </section>
        <div class="notice">
            <div class="notice-light"></div>
            <strong>
                CHECK THE AMOUNT CAREFULLY
            </strong>
        </div>
        <div class="controls">
            <a href="deposit.html" class="control back">
                <span>‹</span>
                <strong>EDIT</strong>
            </a>
            <div class="center-mark">
                <span></span>
                TAJ  AURA
                <span></span>
            </div>
            <a href="deposit-processing.html" class="control confirm">
                <strong>CONFIRM DEPOSIT</strong>
                <span>✓</span>
            </a>
        </div>
    </main>
    <div class="footer-line"></div>
</div>
</body>
</html>
