<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAJ AURA - PIN Reset Successful</title>
    <link rel="stylesheet" href="pin-reset-success.css">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/8983/8983163.png">
</head>
<body>
<div class="atm">
    <div class="led-border"></div>
    <header class="top">
        <div class="brand">
            <div class="logo">T</div>
            <div class="brand-text">
                <h2>TAJ AURA</h2>
                <span>SMART ATM</span>
            </div>
        </div>
        <div class="secure">
            <span></span>
            SECURE CONNECTION
        </div>
    </header>
    <main class="success-screen">
        <div class="success-label">
            PIN RECOVERY
        </div>
        <div class="success-icon">
            <div class="check">✓</div>
        </div>
        <h1>PIN RESET SUCCESSFUL</h1>
        <p class="message">
            Your ATM PIN has been successfully reset.
        </p>
        <div class="success-details">
            <div class="detail">
                <span>STATUS</span>
                <strong>COMPLETED</strong>
            </div>
            <div class="divider"></div>
            <div class="detail">
                <span>SECURITY</span>
                <strong>VERIFIED</strong>
            </div>
            <div class="divider"></div>
            <div class="detail">
                <span>PIN</span>
                <strong>UPDATED</strong>
            </div>
        </div>
        <p class="note">
            Your new PIN can now be used for ATM transactions.
        </p>
        <div class="actions">
            <a href="other-services.html" class="menu-btn">
                GO TO MENU
            </a>
            <a href="index.html" class="exit-btn">
                EXIT
            </a>
        </div>
        <div class="status">
            <span></span>
            TRANSACTION COMPLETED
        </div>
    </main>
</div>
</body>
</html>
