<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAJ AURA - Change PIN</title>
    <link rel="stylesheet" href="change-pin.css">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/8983/8983163.png">
</head>
<body>
<div class="atm">
    <div class="led-border"></div>
    <header class="top">
        <div class="brand">
            <div class="logo">T</div>
            <div class="brand-text">
                <h2>TAJ AURA</h2>
                <span>SMART ATM</span>
            </div>
        </div>
        <div class="secure">
            <span></span>
            SECURE CONNECTION
        </div>
    </header>
    <main class="pin-screen">
        <section class="pin-heading">
            <span>SECURITY SETTINGS</span>
            <h1>CHANGE PIN</h1>
            <p>Update your ATM PIN securely</p>
        </section>
        <section class="pin-workspace">
            <div class="pin-info">
                <div class="security-mark">
                    T
                </div>
                <h2>PIN<br>SECURITY</h2>
                <p>
                    Your PIN keeps your
                    account protected.
                </p>
                <div class="security-line"></div>
                <small>
                    NEVER SHARE YOUR PIN
                </small>
            </div>
            <div class="pin-form">
                <div class="field active">
                    <div class="field-label">
                        CURRENT PIN
                    </div>
                    <div class="pin-dots">
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>
                <div class="field">
                    <div class="field-label">
                        NEW PIN
                    </div>
                    <div class="pin-dots">
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>
                <div class="field">
                    <div class="field-label">
                        CONFIRM NEW PIN
                    </div>
                    <div class="pin-dots">
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>
                <div class="keypad">
                    <button>1</button>
                    <button>2</button>
                    <button>3</button>
                    <button>4</button>
                    <button>5</button>
                    <button>6</button>
                    <button>7</button>
                    <button>8</button>
                    <button>9</button>
                    <button class="clear">
                        CLEAR
                    </button>
                    <button>0</button>
                    <a href="pin-change-success.html"><button class="enter">
                        ENTER
                    </button></a>
                </div>
            </div>
        </section>
        <div class="bottom">
            <a href="other-services.html" class="back">
                ← BACK
            </a>
            <div class="status">
                <span></span>
                ENTER 4-DIGIT PIN
            </div>
            <a href="index.html" class="exit">
                EXIT
            </a>
        </div>
    </main>
</div>
</body>
</html>
