<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAJ AURA - Card Blocked</title>
    <link rel="stylesheet" href="block-success.css">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/8983/8983163.png">
</head>
<body>
<div class="atm">
    <div class="led-border"></div>
    <header class="top">
        <div class="brand">
            <div class="logo">T</div>
            <div class="brand-text">
                <h2>TAJ AURA</h2>
                <span>SMART ATM</span>
            </div>
        </div>
        <div class="secure">
            <span></span>
            SECURE CONNECTION
        </div>
    </header>
    <main class="success-screen">
        <div class="heading">
            <span>CARD SECURITY</span>
            <h1>CARD BLOCKED</h1>
        </div>
        <div class="success-icon">
            <div class="check">✓</div>
        </div>
        <h2>
            CARD BLOCKED SUCCESSFULLY
        </h2>
        <p class="message">
            Your card has been blocked successfully.
        </p>
        <div class="details">
            <div class="detail">
                <span>CARD NUMBER</span>
                <strong>
                    •••• 4826
                </strong>
            </div>
            <div class="line"></div>
            <div class="detail">
                <span>STATUS</span>
                <strong class="blocked">
                    BLOCKED
                </strong>
            </div>
            <div class="line"></div>
            <div class="detail">
                <span>SECURITY</span>
                <strong>
                    PROTECTED
                </strong>
            </div>
        </div>
        <p class="note">
            ATM and card transactions are now disabled.
        </p>
        <div class="actions">
            <a href="card-services.html" class="menu-btn">
                CARD SERVICES
            </a>
            <a href="index.html" class="exit-btn">
                EXIT
            </a>
        </div>
        <div class="status">
            <span></span>
            CARD SECURITY UPDATED
        </div>
    </main>
</div>
</body>
</html>
