<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAJ AURA - Processing Transfer</title>
    <link rel="stylesheet" href="fund-transfer-processing.css">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/8983/8983163.png">
</head>
<body>
<div class="atm">
    <div class="led-border"></div>
    <header class="top">
        <div class="brand">
            <div class="logo">T</div>
            <div class="brand-name">
                <h2>TAJ AURA</h2>
                <span>SMART ATM</span>
            </div>
        </div>
        <div class="secure">
            <span></span>
            SECURE
        </div>
    </header>
    <main class="processing-screen">
        <div class="heading">
            <span>TRANSACTION</span>
            <h1>Processing Transfer</h1>
            <p>Please wait while your transaction is being processed</p>
        </div>
        <div class="processing-area">
            <div class="transfer-route">
                <div class="account-node">
                    <span>FROM</span>
                    <strong>•••• 4821</strong>
                </div>
                <div class="route">
                    <div class="route-line"></div>
                    <div class="moving-light"></div>
                </div>
                <div class="account-node">
                    <span>TO</span>
                    <strong>•••• 7392</strong>
                </div>
            </div>
            <div class="processing-word">
                <span class="loader-line"></span>
                <strong>PROCESSING</strong>
                <span class="loader-line"></span>
            </div>
            <div class="amount">
                ₹28,000
            </div>
        </div>
        <div class="status">
            <div class="status-item active">
                <span>01</span>
                <p>Verifying</p>
            </div>
            <div class="status-item active">
                <span>02</span>
                <p>Transferring</p>
            </div>
            <div class="status-item">
                <span>03</span>
                <p>Completing</p>
            </div>
        </div>
        <div class="notice">
            <span>●</span>
            <p>
                Do not remove your card or cancel the transaction
            </p>
        </div>
        <a href="fund-transfer-success.html" class="continue-btn">
            CONTINUE
            <span>→</span>
        </a>
    </main>
</div>
</body>
</html>
