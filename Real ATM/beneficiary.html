<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAJ AURA - Beneficiary Account</title>
    <link rel="stylesheet" href="beneficiary.css">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/8983/8983163.png">
</head>
<body>
<div class="atm">
    <div class="led-border"></div>
    <header class="top">
        <div class="brand">
            <div class="logo">T</div>
            <div class="brand-name">
                <h2>TAJ AURA</h2>
                <span>SMART ATM</span>
            </div>
        </div>
        <div class="secure">
            <span></span>
            SECURE
        </div>
    </header>
    <main class="keypad-screen">
        <div class="heading">
            <span>FUND TRANSFER</span>
            <h1>Beneficiary Account</h1>
            <p>Enter the account number to continue</p>
        </div>
        <div class="account-display">
            <small>ACCOUNT NUMBER</small>
            <div class="display-number">
                <span>• • • •</span>
                <span>• • • •</span>
                <span>• • • •</span>
                <span>• • • •</span>
            </div>
        </div>
        <section class="keypad">
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="special clear">CLEAR</button>
            <button>0</button>
            <a href="/Real ATM/fund-transfer.html"><button class="special enter">ENTER</button></a>
        </section>
        <div class="bottom-actions">
            <a href="fund-transfer.html" class="back-btn">
                ← BACK
            </a>
            <div class="secure-note">
                ACCOUNT DETAILS ARE SECURE
            </div>
        </div>
    </main>
</div>
</body>
</html>
