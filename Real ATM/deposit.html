<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAJ AURA - Cash Deposit</title>
    <link rel="stylesheet" href="deposit.css">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/8983/8983163.png">
</head>
<body>
<div class="atm">
    <div class="glow glow-one"></div>
    <div class="glow glow-two"></div>
    <div class="scan-light"></div>
    <header>
        <div class="brand">
            <div class="logo">T</div>
            <div>
                <h2>TAJ AURA</h2>
                <p>SMART ATM</p>
            </div>
        </div>
        <div class="secure">
            <span></span>
            SECURE
        </div>
    </header>
    <main>
        <div class="title">
            <span>02</span>
            <h1>CASH DEPOSIT</h1>
        </div>
        <section class="deposit-zone">
            <div class="deposit-info">
                <div class="small-label">
                    DEPOSIT MODULE
                </div>
                <h3>
                    INSERT YOUR
                    <br>
                    CASH
                </h3>
                <p>
                    Place your notes neatly inside
                    the cash deposit tray.
                </p>
                <div class="instruction">
                    <span class="instruction-light"></span>
                    <strong>
                        CASH ACCEPTING
                    </strong>
                </div>
            </div>
            <div class="deposit-machine">
                <div class="slot-light"></div>
                <div class="deposit-slot">
                    <div class="slot-inner"></div>
                    <div class="slot-line"></div>
                </div>
                <div class="slot-label">
                    CASH TRAY
                </div>
                <div class="tray-light"></div>
            </div>
        </section>
        <div class="deposit-status">
            <div class="status-icon">
                ₹
            </div>
            <div class="status-text">
                <strong>
                    READY FOR DEPOSIT
                </strong>
                <span>
                    Maximum notes accepted: 50
                </span>
            </div>
            <div class="status-led"></div>
        </div>
        <div class="controls">
            <a href="menu.html" class="control back">
                <span>‹</span>
                <strong>
                    BACK TO MENU
                </strong>
            </a>
            <div class="center-mark">
                <span></span>
                TAJ AURA
                <span></span>
            </div>
            <a href="deposit-confirm.html" class="control continue">
                <strong>
                    CONTINUE
                </strong>
                <span>›</span>
            </a>
        </div>
    </main>
    <div class="footer-line"></div>
</div>
</body>
</html>
