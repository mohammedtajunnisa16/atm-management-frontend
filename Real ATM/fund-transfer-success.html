<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAJ AURA - Transfer Successful</title>
    <link rel="stylesheet" href="fund-transfer-success.css">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/8983/8983163.png">
</head>
<body>
<div class="atm">
    <div class="led-border"></div>
    <header class="top">
        <div class="brand">
            <div class="logo">T</div>
            <div class="brand-name">
                <h2>TAJ AURA</h2>
                <span>SMART ATM</span>
            </div>
        </div>
        <div class="secure">
            <span></span>
            SECURE
        </div>
    </header>
    <main class="success-screen">
        <div class="success-symbol">
            <div class="success-ring">
                <svg
                    viewBox="0 0 100 100"
                    class="check">
                    <circle
                        cx="50"
                        cy="50"
                        r="44"
                        class="circle"/>
                    <path
                        d="M28 51 L43 66 L73 34"
                        class="check-path"/>
                </svg>
            </div>
            <div class="success-glow"></div>
        </div>
        <div class="success-heading">
            <span>TRANSACTION COMPLETE</span>
            <h1>Transfer Successful</h1>
            <p>
                Your funds have been transferred successfully
            </p>
        </div>
        <div class="amount-section">
            <small>AMOUNT TRANSFERRED</small>
            <div class="amount">
                <span>₹</span>
                28,000
            </div>
            <label>INDIAN RUPEES</label>
        </div>
        <div class="transaction-details">
            <div class="detail">
                <span>FROM</span>
                <strong>
                    •••• 4821
                </strong>
            </div>
            <div class="detail-divider"></div>
            <div class="detail">
                <span>TO</span>
                <strong>
                    •••• 7392
                </strong>
            </div>
            <div class="detail-divider"></div>
            <div class="detail">
                <span>STATUS</span>
                <strong class="success-text">
                    COMPLETED
                </strong>
            </div>
        </div>
        <div class="transaction-id">
            TRANSACTION ID
            <strong>
                TJX84729301
            </strong>
        </div>
        <div class="actions">
            <a href="menu.html" class="menu-btn">
                GO TO MENU
            </a>
            <a href="index.html" class="exit-btn">
                EXIT
            </a>
        </div>
        <div class="bottom-note">
            <span></span>
            THANK YOU FOR USING TAJ AURA
        </div>
    </main>
</div>
</body>
</html>
