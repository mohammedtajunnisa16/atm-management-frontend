<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAJ AURA - Other Amount</title>
    <link rel="stylesheet" href="other.css">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/8983/8983163.png">
</head>
<body>
<main class="atm-screen">
    <div class="ambient-light"></div>
    <div class="light-sweep"></div>
    <div class="screen-border"></div>
    <header class="top-bar">
        <div class="brand">
            <div class="logo-box">T</div>
            <div>
                <div class="brand-name">TAJ AURA</div>
                <div class="brand-sub">
                    PREMIUM BANKING
                </div>
            </div>
        </div>
        <div class="secure-status">
            <span class="secure-dot"></span>
            SECURE ATM
        </div>
    </header>
    <section class="other-content">
        <div class="eyebrow">
            CASH WITHDRAWAL
        </div>
        <h1>
            ENTER WITHDRAWAL AMOUNT
        </h1>
        <p class="subtitle">
            Please enter the amount you wish to withdraw
        </p>
        <div class="amount-display">
            <div class="display-label">
                WITHDRAWAL AMOUNT
            </div>
            <div class="amount-value">
                <span>₹</span> 0
            </div>
            <div class="display-line"></div>
        </div>
        <div class="keypad">
            <button class="key">1</button>
            <button class="key">2</button>
            <button class="key">3</button>
            <button class="key">4</button>
            <button class="key">5</button>
            <button class="key">6</button>
            <button class="key">7</button>
            <button class="key">8</button>
            <button class="key">9</button>
            <button class="key special">00</button>
            <button class="key">0</button>
            <button class="key special">000</button>
        </div>
        <div class="actions">
            <a href="withdrawal.html" class="action cancel">
                CANCEL
            </a>
            <button class="action clear">
                CLEAR
            </button>
            <a href="confirm.html" class="action enter">
                ENTER
            </a>
        </div>
        <div class="amount-note">
            <span class="note-dot"></span>
            ENTER AMOUNT IN MULTIPLES OF ₹100
        </div>
    </section>
    <div class="bottom-led"></div>
</main>
</body>
</html>
